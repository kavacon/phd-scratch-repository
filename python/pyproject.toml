[project]
name = "python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
# Reading generated OpenQASM back, counting gates and wires, and the black-box decomposition and optimisation stages.
circuits = [
    "qiskit>=2",
    "qiskit-qasm3-import",
    "openqasm3[parser]",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"parser" = ["resources/*"]
"allocation_poc" = ["static/*"]