[project]
name = "python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
    "qiskit>=2",  # the circuit representation, and the optimiser
]

[project.optional-dependencies]
# Reading OpenQASM text back (to check what is printed), and running circuits on a simulator.
circuits = [
    "qiskit-qasm3-import",
    "openqasm3[parser]",
    "qiskit-aer",
]
# The ZX optimiser the encodings experiment compares with Qiskit's.
zx = [
    "pyzx",
]
# The Qrisp comparison app (experiments.allocation_poc.compare), which also needs the circuits extra.
compare = [
    "qrisp",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"compiler.parser" = ["resources/*"]
"demo" = ["static/*"]
"experiments.allocation_poc" = ["static/*"]