[project]
name = "python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
    "qiskit>=2",  # the circuit representation, and the optimiser
]

[project.optional-dependencies]
# Reading OpenQASM text back (to check what is printed), and running circuits on a simulator.
circuits = [
    "qiskit-qasm3-import",
    "openqasm3[parser]",
    "qiskit-aer",
]
# The ZX optimiser the encodings experiment compares with Qiskit's.
zx = [
    "pyzx",
]
# The Qrisp comparison app (experiment_allocation_poc.compare), which also needs the circuits extra.
compare = [
    "qrisp",
]
# The existing_ir experiment: MQT's compiler collection (the QC and QCO dialects, their passes and exporters), used here
# to export the lowered programs. The C++ tool in experiment_existing_ir/cpp does the lowering.
mlir = [
    "mqt.core==4.1.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# The code is run from source (see env.sh and test.sh), not installed: this project only names its dependencies.
[tool.setuptools]
packages = []
